<!doctype html>
<meta charset="utf-8">
<title>Journey hero, second take: one object</title>
<style>html,body{margin:0;height:100%;background:#151314;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<canvas></canvas>
<script type="module">
import { makeCamera, dot } from '../../../public/journey/hero/engine.mjs';
import { createRenderer } from './sq.mjs';
import { corners } from './kit.mjs';
import { OBJECTS } from './objects.mjs';

const q = new URLSearchParams(location.search), num = (k, d) => q.has(k) ? +q.get(k) : d;
const canvas = document.querySelector('canvas'), R = createRenderer(canvas);
function draw() {
  const W = innerWidth, H = innerHeight, cam = makeCamera(num('yaw', 0), num('pitch', 0));
  const pieces = OBJECTS[num('o', 0)]();
  // centre what is drawn, and fit it
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const pc of pieces) for (const c of corners(pc)) { const x = dot(cam.r, c), y = dot(cam.u, c); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const S = num('S', Math.min(W / (x1 - x0 + 1.6), H / (y1 - y0 + 1.6)));
  const cx = W / 2 - S * (x0 + x1) / 2, cy = H / 2 + S * (y0 + y1) / 2;
  R.draw(pieces, { W, H, dpr: devicePixelRatio, S, cx, cy, cam }, { outline: num('line', 0.03), soft: num('soft', 0), spread: num('spread', 1), floor: { on: num('floor', 1) > 0 } });
  window.__box = { w: +(x1 - x0).toFixed(2), h: +(y1 - y0).toFixed(2), S: +S.toFixed(1) };
  window.__ready = true;
}
draw(); addEventListener('resize', draw);
</script>
