<!doctype html>
<meta charset="utf-8">
<title>Journey hero, second take: one scene</title>
<style>
@font-face{font-family:Outfit;src:url(../../../public/holding/fonts/outfit-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;height:100%;background:#151314;overflow:hidden}canvas{display:block;width:100vw;height:100vh}
</style>
<canvas></canvas>
<script type="module">
// ?s=0..4 the scene, ?yaw=&pitch= turn the view, ?atlas=1 shows the atlas of pictures instead
import { makeCamera, dot } from '../../../public/journey/hero/engine.mjs';
import { createRenderer } from './sq.mjs';
import { corners } from './kit.mjs';
import { makeAtlas, fontsReady } from './art.mjs';
import { SCENES } from './stage.mjs';

const q = new URLSearchParams(location.search), num = (k, d) => q.has(k) ? +q.get(k) : d;
const canvas = document.querySelector('canvas');
await fontsReady();
const atlas = makeAtlas();
if (q.has('atlas')) { canvas.replaceWith(atlas.canvas); atlas.canvas.style.cssText = 'display:block;max-width:100vw;max-height:100vh;background:#444'; window.__ready = true; }
else {
  const R = createRenderer(canvas); R.setAtlas(atlas);
  const draw = () => {
    const W = innerWidth, H = innerHeight, cam = makeCamera(num('yaw', 0), num('pitch', 0)), pieces = SCENES[num('s', 0)]();
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const pc of pieces) for (const c of corners(pc)) { const x = dot(cam.r, c), y = dot(cam.u, c); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    const S = num('S', Math.min(W / (x1 - x0 + 1.2), H / (y1 - y0 + 1.2)));
    R.draw(pieces, { W, H, dpr: devicePixelRatio, S, cx: W / 2 - S * (x0 + x1) / 2, cy: H / 2 + S * (y0 + y1) / 2, cam }, { outline: 0, spread: num('spread', 1), floor: { on: num('floor', 1) > 0, radius: 5.2 } });
    window.__box = { w: +(x1 - x0).toFixed(2), h: +(y1 - y0).toFixed(2), S: +S.toFixed(1), pieces: pieces.length };
  };
  draw(); addEventListener('resize', draw); window.__ready = true;
}
</script>
