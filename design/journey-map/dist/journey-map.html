* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: Outfit, system-ui, sans-serif; }
html { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
img, svg, a { -webkit-user-drag: none; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.trip { position: relative; }
.stage { position: sticky; top: 0; height: 100vh; overflow: clip; }
.map, #nova, #stars { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.map { display: block; transform-origin: 0 0; }
#map-stack { position: absolute; inset: 0; }
#nova, #stars { pointer-events: none; }
#deep, #air, #sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#sky { display: contents; }
#sky.sky-off > * { display: none; }
#sky > svg { position: absolute; left: 0; top: 0; overflow: visible; transform-origin: 0 0; pointer-events: none; }
/* One composited craft veil, a canvas drawn at the shown camera (part 17e), so its holes stay on the ink; its svg keeps
   only the definitions (the holes, the line cuts). */
#map-veil { pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .3s; }
#map-veil-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.rm #map-veil { transition: none; }
.rm .st-traveller { display: none; }
.st-traveller { position: absolute; left: 0; top: 0; transform: translate(-50%,-50%); fill: none; stroke: var(--red); pointer-events: none; z-index: 3; opacity: 0; visibility: hidden; }
#sky > .sky-glow { position: absolute; left: 0; top: 0; pointer-events: none; visibility: hidden; opacity: 0; transform-origin: 0 0; }
#sky > .sky-glow { border-radius: 50%; z-index: 2; }
.jm-steps #sky > svg { z-index: 2; }
.map text { font-family: Outfit, system-ui, sans-serif; }
/* On dense screens map text is set once and scaled with the map, not set again at every zoom step of a glide (about half
   the phone glide's frame cost; at rest it paints the same there). Low-density screens keep hinted text. */
@media (min-resolution: 2dppx), (-webkit-min-device-pixel-ratio: 2) { .map text { text-rendering: geometricPrecision; } }
.ov { position: absolute; inset: 0; pointer-events: none; }

/* map line styles, ported from the reference */
.l, .o, .g, .pf, .t { stroke: var(--paper); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.l { fill: none; } .o { fill: var(--ink); } .g { fill: var(--land); } .pf { fill: var(--paper); }
.t { fill: none; stroke-opacity: .5; stroke-width: .7; }
.rf { fill: var(--red); }
.h { paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; }
.rn { fill: none; stroke: var(--paper); stroke-width: .9; stroke-opacity: .85; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.rn-dim { stroke-opacity: .5; stroke-width: .7; }
.done, .done-p { fill: none; stroke: var(--paper); stroke-width: 1.3; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.done, #trail-pieces { opacity: 0; }
.find { cursor: pointer; outline: none; }
.find-focus-ring { stroke: none; }
.find:focus-visible > .find-focus-ring { stroke: var(--paper); stroke-width: 2; vector-effect: non-scaling-stroke; }
.hit { fill: transparent; stroke: none; pointer-events: all; }
.touch-hit { fill: none; stroke: transparent; stroke-width: 44px; vector-effect: non-scaling-stroke; pointer-events: stroke; }
#f-wayfinder, #f-beacon { touch-action: none; }
.jm-way .wf-result { opacity: 1 !important; visibility: visible !important; }
.wf-word.on { fill: var(--paper); text-decoration: underline; }
.rs-trace { stroke: transparent; }
.rs-trace.red { stroke: var(--red); stroke-width: 1.6; }

.caption { position: absolute; left: 50%; bottom: 12vh; transform: translateX(-50%); margin: 0; color: var(--dim); font-size: 13px; letter-spacing: .04em; }
.cue { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); margin: 0; color: var(--note); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: 0; }

/* stops and cards: one element each */
.cards { position: absolute; inset: 0; }
.stop { position: absolute; left: 0; top: 0; width: 640px; height: 420px; transform-origin: 0 0; pointer-events: none; }
.stop[data-state="open"], .stop[data-state="moving"] { z-index: 4; }
.stop[data-state="rest"] .st-btn, .stop[data-state="open"] .st-btn, .stop[data-state="moving"] .st-btn { pointer-events: auto; }
.stop[data-state="open"] .face { pointer-events: auto; }
.st-btn { position: absolute; z-index: 3; left: 0; top: 0; width: 400px; height: 400px; transform: translate(-50%,-50%); padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%; }
.stone { display: block; width: 100%; height: 100%; overflow: visible; }
.st-ink { fill: var(--ink); }
.st-fill { fill: var(--mk); opacity: 0; }
.st-line { fill: none; stroke: var(--paper); stroke-width: 20; stroke-linejoin: round; }
.st-rune { fill: none; stroke: var(--paper); stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
.st-glow { opacity: 0; }
.face { position: absolute; inset: 0; background: var(--g); color: var(--tx); border-radius: 14px; overflow: hidden; opacity: 0; }
.c-sh { position: absolute; inset: 0; background: var(--shade); opacity: 0; pointer-events: none; }
.c-in { height: 100%; display: flex; flex-direction: column; padding: 20px 24px 20px; }
.c-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--hair); }
.lay-band .c-top { background: var(--band); margin: -20px -24px 16px; padding: 18px 24px; border-bottom: 0; }
.c-logo { display: block; height: var(--logo-h, 44px); width: auto; max-width: 210px; object-fit: contain; object-position: left center; }
.c-pill { flex: none; background: var(--pill); color: var(--ptx); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.c-body { display: grid; grid-template-columns: 1fr 210px; gap: 24px; min-height: 0; }
.c-main { min-width: 0; }
.c-h { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.08; color: var(--hd); margin: 0 0 5px; }
.c-role { font-size: 12.5px; color: var(--sub); margin: 0 0 10px; }
.c-para { font-size: 13.5px; line-height: 1.45; margin: 0 0 12px; }
.c-steps { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; padding: 0; font-size: 11px; }
.c-steps li { border: 1px solid var(--hair); border-radius: 999px; padding: 3px 9px; background: var(--chip, transparent); color: var(--chtx, var(--tx)); }
.c-kick { font-size: 9.5px; letter-spacing: .14em; color: var(--sub); margin: 0 0 3px; font-weight: 600; }
.c-took { font-size: 14px; font-weight: 700; margin: 0; line-height: 1.3; }
.c-side { display: flex; flex-direction: column; justify-content: center; gap: 10px; min-width: 0; }
.c-piece { margin: 0; }
.c-piece img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 6px; }
.c-empty { aspect-ratio: 3 / 2; border: 1px dashed var(--sub); border-radius: 6px; display: grid; place-items: center; color: var(--sub); font-size: 12px; }
.c-piece figcaption { font-size: 11px; color: var(--sub); margin-top: 5px; }
.c-role, .c-para, .c-crafts, .c-piece figcaption, .c-empty { font-weight: var(--sw, 400); }
.c-crafts { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 0; padding: 0; font-size: 9.5px; color: var(--sub); }

/* timeline */
.tl { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; padding: 0 28px; display: flex; align-items: stretch; gap: 20px; pointer-events: auto; touch-action: none; z-index: 3; opacity: 0; cursor: pointer; }

.tl-tip.on { opacity: 1; }

/* phones */
@media (max-width: 640px) {

  .c-body { grid-template-columns: 1fr; gap: 14px; }
  .c-h { font-size: 22px; }
  .c-piece img, .c-empty { aspect-ratio: 16 / 7; }
  .mini { display: none; }
  .tl { height: 44px; padding: 0 16px; gap: 12px; }
  .tl-rows { top: 5px; }
  .tl-tick { top: 21px; height: 5px; } .tl-tick b { top: 6px; font-size: 8.5px; }
  .tl-base { left: 16px; right: 112px; top: 23px; }
  .tl-head { top: 16px; }
  .tl-count { width: 84px; font-size: 10px; }
  .tl-tip { bottom: 44px; }
  .cue { bottom: 56px; }
  .ft-in { padding: 14vh 16px 22px; }
  .ft-q { font-size: 24px; }
  .ft-tag { font-size: 13px; }
  .ft-tag { margin: 12px 0 14px; }
  .ft-talk { height: 46px; line-height: 20px; padding-top: 0; padding-bottom: 0; }
  .ft-links { flex-direction: column; align-items: flex-start; }

  .iris { width: 344px; height: 344px; left: -172px; top: -172px; }

}

/* reduced motion: the map at overview, the cards as sections, the timeline as a sticky jump menu */
.rm .trip { height: auto; }
.rm .stage { position: relative; }
.rm .caption, .rm .cue, .rm .mini { display: none; }
.rm .rm-cards { padding: 56px 16px 0; display: flex; flex-direction: column; align-items: center; gap: 40px; }
.rm .stop { position: relative; transform: none; width: min(640px, 100%); height: auto; min-height: 420px; pointer-events: auto; }
.rm .st-btn { display: none; }
.rm .c-sh, .rm #air, .rm #sky { display: none; }
.rm .face { position: relative; opacity: 1; border-radius: 14px; pointer-events: auto; }
.rm .c-in { opacity: 1; min-height: 420px; }
.rm .tl { position: sticky; bottom: 0; width: 100%; opacity: 1; background: var(--ink); border-top: 1px solid var(--line); }
.rm .tl-blk em { opacity: 1; }
.rm .tl-head { display: none; }
.rm .tl-blk { cursor: pointer; }
.rm .ft { position: relative; visibility: visible; height: 100vh; min-height: 560px; background: radial-gradient(ellipse 30% 26% at 68% 30%, color-mix(in srgb, var(--warm) 55%, transparent), transparent 70%), radial-gradient(ellipse 70% 60% at 62% 38%, color-mix(in srgb, var(--red) 55%, transparent), transparent 75%); }
.rm .ft-r { opacity: 1; }
.rm .ft-rule { background: var(--mid); }
.rm .ft-rule::after { content: ''; float: right; width: 7px; height: 7px; margin-top: -3px; border-radius: 50%; background: var(--red); }

/* Steps changes the progress source and reserves space for its navigation. */
html.jm-steps, .jm-steps body { height: 100%; overflow: hidden; overscroll-behavior: none; }
.jm-steps .trip { height: 100vh; }
.jm-steps .stage { touch-action: pinch-zoom; }
.jm-explore .stage { touch-action: none; cursor: grab; }
.jm-explore .stage.is-dragging { cursor: grabbing; }
.jm-explore .go { animation: exploreRow var(--explore-row-fade) var(--explore-row-delay) linear both; }
@keyframes exploreRow { from { opacity: 0; } to { opacity: 1; } }
.jm-explore .go-back { width: auto; padding: 0 var(--go-gap); display: flex; align-items: center; gap: var(--go-gap); border-radius: var(--go-h); }
.jm-steps .c-close { position: relative; flex: none; width: var(--card-close-hit); height: var(--card-close-hit); display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; color: var(--tx); background: var(--g); cursor: pointer; }
/* L-10: the close on the date pill's line; on a band card, in the band */
.jm-steps .lay-band .c-close { color: var(--g); background: var(--band); }
.jm-steps .stop[data-state="open"] .c-close { pointer-events: auto; }
.c-close i { position: relative; width: var(--card-close-icon); height: var(--card-close-icon); }
.c-close i::before, .c-close i::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: var(--card-close-stroke); background: currentColor; transform: rotate(45deg); }
.c-close i::after { transform: rotate(-45deg); }
.jm-steps .c-logo { min-width: 0; }
.jm-steps .face { overflow: hidden; }
.jm-steps .c-in { height: auto; min-height: 100%; }
.jm-steps .cue { display: none; }
/* K-4: the phone kicker ends before the serpent; its rule and plate shorten with it */
@media (max-width: 640px) { .kick { letter-spacing: .8px; } .kick-r { transform: scaleX(.82); transform-box: view-box; transform-origin: 0 0; } }
.jm-steps .caption { bottom: max(12vh, calc(56px + var(--go-gap) + var(--go-h) + 28px)); }
@media (max-width: 640px) { .jm-steps .caption { bottom: max(12vh, calc(var(--go-bar) + 28px)); } }
.jm-steps #stars { z-index: 2; }
.jm-steps #air, .jm-steps #sky > svg { z-index: 2; }
.jm-steps .ov { z-index: 3; }
.jm-cut { position: absolute; inset: 0; z-index: 4; background: var(--ink); opacity: 0; pointer-events: auto; }
.jm-cut[hidden], .go[hidden], .go button[hidden] { display: none; }
.go { position: absolute; z-index: 5; left: 50%; bottom: calc(56px + var(--go-gap)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; height: var(--go-h); }
.go button { cursor: pointer; flex: none; }
.go-back { width: var(--go-h); height: var(--go-h); padding: 0; display: grid; place-items: center; border-radius: 50%; background: var(--ink); border: 1px solid var(--mid); color: var(--paper); }
.go-back .arr { transform: rotate(180deg); }
.go-next { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 16px; min-width: 230px; height: var(--go-h); padding: 0 44px; border: 0; border-radius: 999px; background: var(--paper); color: var(--ink); font-size: 14px; font-weight: 700; }
.go-next .arr { position: absolute; right: 20px; transition: transform var(--go-reveal); }
.go-t { position: relative; }
/* The timeline's track and head move on every frame of a move: each is its own layer, moved without a raster. The Next fill
   redraws its small bar instead: as a layer of its own, the words and arrow got new layers the moment it grew under them
   mid-move, blank for a frame ("Next: Mohawk" in the phone films, pinch recheck 2026-11-27). */
.go-fill { position: absolute; inset: 0; background: var(--ink); opacity: .14; transform: scaleX(0); transform-origin: 0 50%; pointer-events: none; }
.go-next:hover .arr { transform: translateX(2px); }
.go-next:active { transform: scale(.97); }
.go-top { background: none; border: 0; padding: 8px 0; color: var(--note); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
.go.go-end { left: 28px; top: 20px; bottom: auto; transform: none; }
.go-reveal { animation: goReveal var(--go-reveal) both; }
.go-back { position: relative; overflow: visible; }
.go-next { anchor-name: --go-next; }
.go-next .go-light { position: fixed; position-anchor: --go-next; inset: auto; left: anchor(left); top: anchor(top); width: anchor-size(width); height: anchor-size(height); }
.go-light { position: absolute; inset: 0; z-index: 2; overflow: hidden; border-radius: inherit; pointer-events: none; opacity: 0; box-shadow: 0 0 var(--go-shine-glow) var(--paper), inset 0 0 var(--go-shine-glow) var(--paper); }
.go-light::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--paper), transparent); mix-blend-mode: screen; opacity: var(--go-shine-alpha); transform: translateX(-100%); }
.go-shining .go-light { animation: goGlow var(--go-shine-time) ease-in-out both; }
.go-shining .go-light::after { animation: goSweep var(--go-shine-time) ease-in-out both; }
.go-back.go-shining .go-light::after { animation-direction: reverse; }
@keyframes goGlow { 0%, 100% { opacity: 0; } 40%, 60% { opacity: var(--go-shine-alpha); } }
@keyframes goSweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@media (max-width: 640px) { .go:not(.go-end) { overflow: hidden; contain: layout; } .go:not(.go-end) :is(.go-back,.go-next):focus-visible { outline-offset: -4px; } .go:not(.go-end) .go-next:focus-visible { outline-color: var(--ink); } }
@media (prefers-reduced-motion: reduce) { .go-shining .go-light { animation-duration: var(--go-shine-reduced) !important; } .go-shining .go-light::after { animation: none; opacity: 0; } }
@keyframes goReveal { from { opacity: 0; } to { opacity: 1; } }
.jm-review { position: fixed; left: 50%; top: 5px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: var(--ink); color: var(--dim); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.jm-review button { background: none; border: 0; padding: 3px 2px; color: var(--dim); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.jm-review button[aria-pressed="true"] { color: var(--paper); }
.jm-review [data-depth] { border-left: var(--depth-rule) solid var(--dim); margin-left: var(--depth-gap); padding-left: var(--depth-gap); }
.fx-hit { position: absolute; left: 0; top: 0; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.fx-hit[aria-disabled="true"] { pointer-events: none; }
.fx-hit:focus-visible { outline: 2px solid var(--paper); outline-offset: 0; }
.jm-nova-flashed .fx-hit:focus-visible { outline: none; }
/* No ring round the X after a tap or click; keyboard focus keeps it. */
.jm-pointer-focus .fx-hit:focus-visible { outline: none; }
@media (max-width: 640px) {
  .jm-steps .tl { bottom: var(--go-bar); }
  .go { left: 0; right: 0; bottom: 0; transform: none; height: var(--go-bar); background: var(--ink); gap: 0; }
  .go-back { width: var(--go-bar); height: var(--go-bar); border: 0; border-radius: 0; }
  .go .go-next { flex: 1; min-width: 0; height: var(--go-bar); border-radius: 0; }
  /* 40 px down while the review switch sits at the top centre */
  .go.go-end { left: 16px; top: 40px; right: auto; width: auto; height: var(--go-h); gap: 12px; background: none; }
  .go.go-end .go-next { flex: none; }
  /* a card on its way up, or open, covers the timeline it sits over */
  .stop[data-state="open"], .stop[data-state="moving"] { z-index: 4; }
  .go-end .go-back { width: var(--go-h); height: var(--go-h); border: 1px solid var(--mid); border-radius: 50%; }
}

/* Part A kit: sizes are set from FIND_PLAY, including the popup's animated inner. */
.mk.found circle { fill: var(--red); }
.mk.found text { fill: var(--ink); }
.mk { transition: opacity .3s; }
.mk.legend-symbol { transition: none; } /* eased by the frame; a fade split the map into new layers */

.marker-layer { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; overflow: visible; pointer-events: none; } .marker-layer .mk { pointer-events: auto; } .jm-focus .marker-layer .mk { pointer-events: none; }

.find-hint:empty { visibility: hidden !important; opacity: 0 !important; } .jm-focus[data-find="all-found"] .label-anchor text { opacity: 1 !important; }
.jm-sheet-open.jm-focus .find-hint, .jm-sheet-open.jm-explore .find-hint { opacity: 0; visibility: hidden; }
@media (max-height: 440px) { .hm-card { gap: 4px; padding: 8px; } .hm-card p { line-height: 14px; } .hm-card h2 { font-size: 21px; } .hm-card .find-slot { padding: 4px; } .hm-end-close { display: none; } }
.tl-count-space { flex: none; width: 110px; } .tl-count-screen { position: absolute; z-index: 5; top: 0; right: 28px; bottom: auto; padding: 5px 8px; line-height: 1; border-radius: 12px; background: var(--ink); pointer-events: auto; translate: 0 calc(100vh - 39px); transition: translate .3s, opacity .3s; }  .rm .tl-count-space { display: none; } @media (max-width: 640px) { .tl-count-space { width: 92px; } .tl-count-screen { right: 16px; translate: 0 calc(100vh - var(--go-bar) - 35px); }  .jm-explore[data-beat="end"] .tl-count-screen { translate: 0 calc(100vh - var(--go-bar) - 35px); } }
@media (max-width: 640px) { html:has(.stop[data-state="open"], .stop[data-state="moving"]) .tl-count-screen { translate: 0 48px; } }
.tl-count-screen, .marker-layer { opacity: 0; }
.jm-nova-away .tl-count-screen { opacity: 0 !important; pointer-events: none; transition: opacity .18s; }
@media (max-width: 640px) { .jm-joined:has([data-hero]:not(.jm-away)) .jm-review { left: 8px; top: 54px; transform: none; } }
.rm #nova, .rm .fx-hit { display: none; }
.rm .pop, .rm .sheet, .rm .sheet-dismiss { position: fixed; }
.rm .tl { position: fixed; left: 0; right: 0; padding-bottom: env(safe-area-inset-bottom); } .rm .ft-in { padding-bottom: 80px; } @media (max-width: 640px) { .rm .tl { height: calc(44px + env(safe-area-inset-bottom)); } }
.fx-hit { min-width: 44px; min-height: 44px; } .sheet { touch-action: none; } .sheet-dismiss { touch-action: manipulation; } .jm-review button { position: relative; min-width: 44px; } .jm-review button::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 44px; min-width: 44px; transform: translateY(-50%); }
.fx-hit.fx-mark-hit { min-width: 0; min-height: 0; }
.jm-pointer-focus .hero .jm-start:focus { outline: none; }
.tl-tip { max-width: calc(100vw - 16px); white-space: normal; }
.map, .marker-layer { visibility: hidden; }
/* L5: the three map svgs take the stack's visibility (hidden until placed). */
#map-stack { visibility: hidden; } #map-stack > .map { visibility: inherit; }
.rm, .rm body { overflow-anchor: none; }

@media (max-height: 440px) and (min-width: 641px) {
  .jm-sheet-open :is(.go,.tl,.tl-count-screen) { opacity: 0 !important; visibility: hidden; pointer-events: none; transition: opacity .18s, visibility 0s .18s; }
  .hammer-sheet .hm-panel { font-size: 14px; width: 540px; height: 430px; left: -270px; top: -215px; grid-template-columns: 300px 180px; grid-template-rows: 90px 1fr 180px; gap: 8px 28px; }
  .hammer-sheet .hm-field { grid-column: 1; grid-row: 1 / 4; }
  .hammer-sheet .hm-header { grid-column: 2; flex-direction: column; align-items: start; justify-content: start; font-size: 14px; line-height: 20px; }
  .hammer-sheet .hm-wave { max-width: none; }
  .hammer-sheet .hm-vitals { align-items: start; }
  .hammer-sheet .hm-status { grid-column: 2; font-size: 14px; }
  .hammer-sheet .hm-buttons { grid-column: 2; flex-direction: column; }
  .hammer-sheet .hm-rune span span, .hammer-sheet .hm-card .pop-k, .hammer-sheet .hm-card p, .hammer-sheet .hm-card .find-slot p { font-size: 14px; line-height: 18px; }
}

/* Keep markers and the bar composited as glide opacities reach one. */
.marker-layer, .marker-layer .mk, #go { will-change: opacity; }
/* Part 17c: marker svgs moved by CSS (no SVG layout per move); the timeline's ink fades on a layer of its own (not the
   rows, which a squeeze would draw soft, nor the years, whose layer would lift the rows onto one). */
.marker-layer > svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
html:not(.rm) .tl-bg { will-change: opacity; }

/* COMB-Q: carved detail is readable only as the camera approaches the serpent. */
.jo-body .jd, .jo-head .jd { opacity: var(--jo-detail, 0); }
.jf, .jf-name { pointer-events: none; }

/* Preview 25 (Dan, 2026-11-27: "Still a ton of flashing"; the phone film scans).
   The first hint after a load used to arrive from display: none, which skips its fade: its box came up in one frame over
   the map above the bar. An empty hint is now only hidden (above), so every hint fades in.
   On a phone the found-count pill trades places as a card opens and closes (the bottom at the overview, the top over a
   card). It slid across the map twice on every move between stops; now it dips out, moves while out of sight, and comes
   back, and stays at the top through a move. */
@keyframes jm-pill-dip-a { 0%, 100% { filter: opacity(1); } 35%, 65% { filter: opacity(0); } }
@keyframes jm-pill-dip-b { 0%, 100% { filter: opacity(1); } 35%, 65% { filter: opacity(0); } }
@media (max-width: 640px) {
  .tl-count-screen { transition: translate .2s steps(1, end), opacity .3s; animation: jm-pill-dip-a .4s linear; }
  html:has(.stop[data-state="open"], .stop[data-state="moving"]) .tl-count-screen { animation-name: jm-pill-dip-b; }
  /* A move keeps it at the top, so a glide from one card to the next does not send it down and back up. */
  html.jm-moving .tl-count-screen { translate: 0 48px; animation-name: jm-pill-dip-b; }
}
/* A stop is hidden until its first frame places it (Dan's phone films, 2026-11-27): the frames wait for the fonts, and
   before that every stop's shield drew at full size in the page's top-left corner for two or three frames of each load. */
html:not(.rm) .stop:not([data-state]) { visibility: hidden; }

/* COMB-R: idle ink shares the stack fade. The growing way lines are drawn in the veil's canvas (part 17f, tripVeil). */
#map-anim { pointer-events: none; visibility: inherit; }
#map-anim .anim-find { opacity: var(--jm-find); }
#map-anim .anim-find.hoard { transition: opacity .3s; }

/* COMB-S: tightly bounded idle ink keeps the stack fade and original SVG order. */
.idle-layer { overflow: hidden; contain: paint; pointer-events: none; will-change: transform; }
.idle-layer .anim-find { opacity: var(--jm-find); }
.idle-layer .anim-find.hoard { transition: opacity .3s; }

/* COMB-S S4: stop ink has a persistent, hit-sized backing through L5 raster commits. */
html:not(.rm) .st-btn { will-change: transform, opacity; }

/* COMB-S S3: bounded cached shadow paint, and the head's own 14 px paint clip. */
html:not(.rm) .c-shadow, html:not(.rm) .c-sh { will-change: transform, opacity; }
.tl-head { contain: layout paint; }

/* Keep all raster children in map order when the common fade reaches opacity one. */
#map-stack { z-index: 0; }

/* COMB-S measured marker clips reached 19841x17901; retain a local paint clip, including the 4 px keyboard outline. */
html:not(.rm) .st-btn { contain: layout paint; overflow-clip-margin: 4px; }

/* COMB-T: bounded text surfaces below the veil and cards, following only transforms. */
#compass-words { position:absolute; inset:0; pointer-events:none; }
.compass-word { position:absolute; left:0; top:0; overflow:visible; transform-origin:0 0; will-change:transform,opacity; transition:opacity .3s; pointer-events:none; contain:layout style; }
.compass-word text { pointer-events:visiblePainted; cursor:pointer; font-family:Outfit,system-ui,sans-serif; }

/* COMB-T: endless beam rotation never invalidates a map raster. */
.bc-spin-clip { position:absolute; overflow:hidden; pointer-events:none; visibility:hidden; }
.bc-spin-position { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
.bc-spin-turn { position:absolute; left:-230px; top:-44.7px; width:230px; height:89.4px; transform-origin:230px 44.7px; will-change:transform; }
.bc-spin-beam { display:block; overflow:visible; opacity:.875; }

.hmc1-screen-hit { position:absolute; left:0; top:0; width:38px; height:23px; z-index:1; transform-origin:0 0; will-change:transform; opacity:0; cursor:pointer; contain:layout style paint; }
.hmc1-screen-hit[hidden] { display:none; }

</style>
