* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: Outfit, system-ui, sans-serif; }
html { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
img, svg, a { -webkit-user-drag: none; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.trip { position: relative; }
.stage { position: sticky; top: 0; height: 100vh; overflow: clip; }
.map, #stars { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.map { display: block; }
#stars { pointer-events: none; }
#deep, #air, #sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.map text { font-family: Outfit, system-ui, sans-serif; }
.ov { position: absolute; inset: 0; pointer-events: none; }

/* map line styles, ported from the reference */
.l, .o, .g, .pf, .t { stroke: var(--paper); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.l { fill: none; } .o { fill: var(--ink); } .g { fill: var(--land); } .pf { fill: var(--paper); }
.t { fill: none; stroke-opacity: .5; stroke-width: .7; }
.rf { fill: var(--red); }
.h { paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; }
.rn { fill: none; stroke: var(--paper); stroke-width: .9; stroke-opacity: .85; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.rn-dim { stroke-opacity: .5; stroke-width: .7; }
.done { fill: none; stroke: var(--paper); stroke-width: 1.3; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: 0; }
.find { cursor: pointer; outline: none; }
.find:focus-visible .hit { stroke: var(--paper); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-dasharray: none; }
.hit { fill: transparent; stroke: none; pointer-events: all; }
#f-wayfinder, #f-beacon { touch-action: none; }
.wf-word.on { fill: var(--red); }
.rs-trace { stroke: transparent; }
.rs-trace.red { stroke: var(--red); stroke-width: 1.6; }

.caption { position: absolute; left: 50%; bottom: 12vh; transform: translateX(-50%); margin: 0; color: var(--dim); font-size: 13px; letter-spacing: .04em; }
.cue { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); margin: 0; color: var(--note); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: 0; }

/* stops and cards: one element each */
.cards { position: absolute; inset: 0; }
.stop { position: absolute; left: 0; top: 0; width: 640px; height: 420px; transform-origin: 0 0; pointer-events: none; }
.stop[data-state="open"] { z-index: 2; }
.stop[data-state="rest"] .st-btn { pointer-events: auto; }
.stop[data-state="open"] .face { pointer-events: auto; }
.st-btn { position: absolute; left: 50%; top: 2.5%; height: 95%; aspect-ratio: 1 / 1; transform: translateX(-50%); padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%; }
.stone { display: block; width: 100%; height: 100%; overflow: visible; }
.st-ink { fill: var(--ink); }
.st-fill { fill: var(--mk); opacity: 0; }
.st-line { fill: none; stroke: var(--paper); stroke-width: 20; stroke-linejoin: round; }
.st-rune { fill: none; stroke: var(--paper); stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
.st-glow { opacity: 0; }
.face { position: absolute; inset: 0; background: var(--g); color: var(--tx); border-radius: 14px; overflow: hidden; opacity: 0; }
.c-sh { position: absolute; inset: 0; background: var(--shade); opacity: 0; pointer-events: none; }
.c-in { height: 100%; display: flex; flex-direction: column; padding: 20px 24px 20px; }
.c-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--hair); }
.lay-band .c-top { background: var(--band); margin: -20px -24px 16px; padding: 18px 24px; border-bottom: 0; }
.c-logo { display: block; height: 44px; width: auto; max-width: 210px; object-fit: contain; object-position: left center; }
.c-pill { flex: none; background: var(--pill); color: var(--ptx); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.c-body { display: grid; grid-template-columns: 1fr 210px; gap: 24px; min-height: 0; }
.c-main { min-width: 0; }
.c-h { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.08; color: var(--hd); margin: 0 0 5px; }
.c-role { font-size: 12.5px; color: var(--sub); margin: 0 0 10px; }
.c-para { font-size: 13.5px; line-height: 1.45; margin: 0 0 12px; }
.c-steps { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; padding: 0; font-size: 11px; }
.c-steps li { border: 1px solid var(--hair); border-radius: 999px; padding: 3px 9px; background: var(--chip, transparent); color: var(--chtx, var(--tx)); }
.c-kick { font-size: 9.5px; letter-spacing: .14em; color: var(--sub); margin: 0 0 3px; font-weight: 600; }
.c-took { font-size: 14px; font-weight: 700; margin: 0; line-height: 1.3; }
.c-side { display: flex; flex-direction: column; justify-content: center; gap: 10px; min-width: 0; }
.c-piece { margin: 0; }
.c-piece img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 6px; }
.c-empty { aspect-ratio: 3 / 2; border: 1px dashed var(--sub); border-radius: 6px; display: grid; place-items: center; color: var(--sub); font-size: 12px; }
.c-piece figcaption { font-size: 11px; color: var(--sub); margin-top: 5px; }
.c-role, .c-para, .c-crafts, .c-piece figcaption, .c-empty { font-weight: var(--sw, 400); }
.c-crafts { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 0; padding: 0; font-size: 9.5px; color: var(--sub); }
.c-crafts i { display: block; height: 4px; border-radius: 2px; background: var(--tx); opacity: .22; margin-bottom: 4px; }
.c-crafts .lit { color: var(--tx); } .c-crafts .lit i { opacity: 1; }
.c-btn { background: var(--btn); color: var(--btx); border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; font-size: 13px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; cursor: pointer; }
.arr { width: 14px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* mini-map */
.mini { position: absolute; top: 20px; right: 20px; width: 104px; aspect-ratio: 600 / 900; border: 1px solid var(--line); border-radius: 6px; background: var(--ink); opacity: 0; pointer-events: auto; }
.mini svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mm-coast { fill: var(--land); stroke: var(--dim); stroke-width: 1; vector-effect: non-scaling-stroke; }
.mm-trail { fill: none; stroke: var(--note); stroke-width: 1; stroke-dasharray: 1 2; vector-effect: non-scaling-stroke; }
.mm-view { fill: none; stroke: var(--paper); stroke-width: 1; vector-effect: non-scaling-stroke; }
.mm-trav { fill: var(--red); }
.mm-stop { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.mm-stop i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--paper); background: var(--ink); }
.mm-stop.on i { background: var(--mk); border-color: var(--mk); }

/* find popups */
.pop { position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none; display: none; }
.pop.on { display: block; }

.pz-front p { font-size: 12.5px; line-height: 1.35; }

/* footer */
.ft { position: absolute; inset: 0; z-index: 4; visibility: hidden; }

.ft-name > .is-live { -webkit-text-fill-color: transparent; }

.ft-name .foot-name-ch { position: absolute; top: 0; left: 0; white-space: pre; }
.foot-name-ch::before { content: attr(data-ch); }

.ft-big .ft-link { font-weight: 800; font-size: 20px; margin-right: 24px; letter-spacing: -.01em; }
.ne { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ft-small { font-size: 11px; letter-spacing: .14em; color: var(--dim); white-space: nowrap; }
.ft-small .ft-link { font-size: 11px; font-weight: 600; letter-spacing: .14em; }
.ft-small i { font-style: normal; margin: 0 8px; }

/* timeline */
.tl { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; padding: 0 28px; display: flex; align-items: stretch; gap: 20px; pointer-events: auto; touch-action: none; z-index: 3; opacity: 0; cursor: pointer; }
.tl-bg { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: linear-gradient(to top, var(--ink) 62%, transparent); pointer-events: none; }
.tl-view { position: relative; flex: 1; overflow: clip; }
.tl-track { position: absolute; left: 0; top: 0; height: 100%; width: 100%; }
.tl-rows { position: absolute; left: 0; right: 0; top: 10px; transform-origin: 0 100%; }
.tl-row { position: relative; height: 6px; margin-bottom: 3px; }
.tl-blk { position: absolute; top: 0; height: 100%; background: var(--mid); border-radius: 2px; }
.tl-blk em { position: absolute; inset: 0; border-radius: 2px; background: var(--mk); opacity: 0; }
.tl-tick { position: absolute; top: 28px; width: 1px; height: 6px; background: var(--dim); }
.tl-tick b { position: absolute; top: 9px; left: 2px; font-size: 9.5px; font-weight: 500; color: var(--dim); }
.tl-base { position: absolute; left: 28px; right: 158px; top: 31px; height: 1px; background: var(--mid); pointer-events: none; }
.tl-head { position: absolute; left: -7px; top: 24px; width: 14px; height: 14px; z-index: 1; }

.tl-count { align-self: center; width: 110px; text-align: right; font-size: 11px; color: var(--dim); white-space: nowrap; }
.tl-tip { position: absolute; left: 0; bottom: 56px; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-size: 12px; white-space: nowrap; opacity: 0; pointer-events: none; }
.tl-tip.on { opacity: 1; }

/* phones */
@media (max-width: 640px) {
  .face { border-radius: 16px 16px 0 0; overflow-y: auto; overscroll-behavior: contain; }
  .c-in { height: auto; min-height: 100%; padding: 16px 16px 18px; }
  .lay-band .c-top { margin: -16px -16px 14px; padding: 14px 16px; }
  .c-logo { height: 34px; max-width: 170px; }
  .c-body { grid-template-columns: 1fr; gap: 14px; }
  .c-h { font-size: 22px; }
  .c-piece img, .c-empty { aspect-ratio: 16 / 7; }
  .mini { display: none; }
  .tl { height: 44px; padding: 0 16px; gap: 12px; }
  .tl-rows { top: 5px; }
  .tl-tick { top: 21px; height: 5px; } .tl-tick b { top: 6px; font-size: 8.5px; }
  .tl-base { left: 16px; right: 112px; top: 23px; }
  .tl-head { top: 16px; }
  .tl-count { width: 84px; font-size: 10px; }
  .tl-tip { bottom: 44px; }
  .cue { bottom: 56px; }
  .ft-in { padding: 14vh 16px 22px; }
  .ft-q { font-size: 24px; }
  .ft-tag { font-size: 13px; }
  .ft-links { flex-direction: column; align-items: flex-start; }
  .ft-big .ft-link { font-size: 17px; }
  .iris { width: 344px; height: 344px; left: -172px; top: -172px; }
  .player { width: 300px; }
}

/* reduced motion: the map at overview, the cards as sections, the timeline as a sticky jump menu */
.rm .trip { height: auto; }
.rm .stage { position: relative; }
.rm .caption, .rm .cue, .rm .mini { display: none; }
.rm .rm-cards { padding: 56px 16px 0; display: flex; flex-direction: column; align-items: center; gap: 40px; }
.rm .stop { position: relative; transform: none; width: min(640px, 100%); height: auto; min-height: 420px; pointer-events: auto; }
.rm .st-btn { display: none; }
.rm .c-sh, .rm #air, .rm #sky { display: none; }
.rm .face { position: relative; opacity: 1; border-radius: 14px; pointer-events: auto; }
.rm .c-in { opacity: 1; min-height: 420px; }
.rm .tl { position: sticky; bottom: 0; width: 100%; opacity: 1; background: var(--ink); border-top: 1px solid var(--line); }
.rm .tl-blk em { opacity: 1; }
.rm .tl-head { display: none; }
.rm .tl-blk { cursor: pointer; }
.rm .ft { position: relative; visibility: visible; height: 100vh; min-height: 560px; background: radial-gradient(ellipse 30% 26% at 68% 30%, color-mix(in srgb, var(--warm) 55%, transparent), transparent 70%), radial-gradient(ellipse 70% 60% at 62% 38%, color-mix(in srgb, var(--red) 55%, transparent), transparent 75%); }
.rm .ft-r { opacity: 1; }
.rm .ft-rule { background: var(--mid); }
.rm .ft-rule::after { content: ''; float: right; width: 7px; height: 7px; margin-top: -3px; border-radius: 50%; background: var(--red); }

/* Steps changes the progress source and reserves space for its navigation. */
html.jm-steps, .jm-steps body { height: 100%; overflow: hidden; overscroll-behavior: none; }
.jm-steps .trip { height: 100vh; }
.jm-steps .stage { touch-action: pinch-zoom; }
.jm-explore .stage { touch-action: none; cursor: grab; }
.jm-explore .stage.is-dragging { cursor: grabbing; }
.jm-explore .go-back { width: auto; padding: 0 var(--go-gap); display: flex; align-items: center; gap: var(--go-gap); border-radius: var(--go-h); }
.jm-steps .c-close { position: absolute; top: var(--card-close-inset); right: var(--card-close-inset); width: var(--card-close-hit); height: var(--card-close-hit); display: none; place-items: center; padding: 0; border: 0; border-radius: 0 var(--card-close-radius) 0 0; color: var(--tx); background: var(--g); cursor: pointer; }
.jm-steps .stop[data-state="open"] > .c-close { display: grid; pointer-events: auto; }
.c-close i { position: relative; width: var(--card-close-icon); height: var(--card-close-icon); }
.c-close i::before, .c-close i::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: var(--card-close-stroke); background: currentColor; transform: rotate(45deg); }
.c-close i::after { transform: rotate(-45deg); }
.jm-steps .c-top { padding-right: var(--card-close-hit); }
.jm-steps .c-logo { min-width: 0; }
.jm-steps .lay-band .c-top { padding-right: calc(24px + var(--card-close-hit)); }
.jm-steps .face { touch-action: pan-y pinch-zoom; overflow-y: auto; overscroll-behavior: contain; }
.jm-steps .c-in { height: auto; min-height: 100%; }
.jm-steps .cue { display: none; }
.jm-steps #stars { z-index: 2; }
.jm-steps #air, .jm-steps #sky { z-index: 2; }
.jm-steps .ov { z-index: 3; }
.jm-cut { position: absolute; inset: 0; z-index: 4; background: var(--ink); opacity: 0; pointer-events: auto; }
.jm-cut[hidden], .go[hidden], .go button[hidden] { display: none; }
.go { position: absolute; z-index: 5; left: 50%; bottom: calc(56px + var(--go-gap)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; height: var(--go-h); }
.go button { cursor: pointer; flex: none; }
.go-back { width: var(--go-h); height: var(--go-h); padding: 0; display: grid; place-items: center; border-radius: 50%; background: var(--ink); border: 1px solid var(--mid); color: var(--paper); }
.go-back .arr { transform: rotate(180deg); }
.go-next { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 16px; min-width: 230px; height: var(--go-h); padding: 0 44px; border: 0; border-radius: 999px; background: var(--paper); color: var(--ink); font-size: 14px; font-weight: 700; }
.go-next .arr { position: absolute; right: 20px; transition: transform var(--go-reveal); }
.go-t { position: relative; }
.go-fill { position: absolute; inset: 0; background: var(--ink); opacity: .14; transform: scaleX(0); transform-origin: 0 50%; pointer-events: none; }
.go-next:hover .arr { transform: translateX(2px); }
.go-next:active { transform: scale(.97); }
.go-top { background: none; border: 0; padding: 8px 0; color: var(--note); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
.go.go-end { left: 28px; top: 20px; bottom: auto; transform: none; }
.go-reveal { animation: goReveal var(--go-reveal) both; }
@keyframes goReveal { from { opacity: 0; } to { opacity: 1; } }
.jm-review { position: fixed; left: 50%; top: 5px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: var(--ink); color: var(--dim); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.jm-review button { background: none; border: 0; padding: 3px 2px; color: var(--dim); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.jm-review button[aria-pressed="true"] { color: var(--paper); }
.jm-review [data-depth] { border-left: var(--depth-rule) solid var(--dim); margin-left: var(--depth-gap); padding-left: var(--depth-gap); }
.fx-hit { cursor: pointer; }
.fx-hit[aria-disabled="true"] { pointer-events: none; }
.fx-hit:focus-visible { outline: none; stroke: var(--paper); stroke-width: 2; vector-effect: non-scaling-stroke; }
@media (max-width: 640px) {
  .jm-steps .tl { bottom: var(--go-bar); }
  .go { left: 0; right: 0; bottom: 0; transform: none; height: var(--go-bar); background: var(--ink); gap: 0; }
  .go-back { width: var(--go-bar); height: var(--go-bar); border: 0; border-radius: 0; }
  .go .go-next { flex: 1; min-width: 0; height: var(--go-bar); border-radius: 0; }
  /* 40 px down while the review switch sits at the top centre */
  .go.go-end { left: 16px; top: 40px; right: auto; width: auto; height: var(--go-h); gap: 12px; background: none; }
  .go.go-end .go-next { flex: none; }
  /* a card on its way up, or open, covers the timeline it sits over */
  .stop[data-state="open"], .stop[data-state="moving"] { z-index: 4; }
  .go-end .go-back { width: var(--go-h); height: var(--go-h); border: 1px solid var(--mid); border-radius: 50%; }
}

/* Part A kit: sizes are set from FIND_PLAY, including the popup's animated inner. */
.mk.found circle { fill: var(--red); }
.mk.found text { fill: var(--ink); }
.mk { transition: opacity .3s; }
.find-hint { position: absolute; z-index: 5; left: 50%; bottom: 124px; transform: translateX(-50%); margin: 0; max-width: calc(100% - 32px); text-align: center; white-space: nowrap; font-size: 12px; line-height: 1.4; letter-spacing: .02em; color: var(--dim); opacity: 0; transition: opacity .3s; pointer-events: none; }
.jm-focus .find-hint { opacity: 1; }
.jm-sheet-open .find-hint { opacity: 0; }
.explore-hint.on { opacity: 1; }
@media (max-width: 640px) { .find-hint { bottom: 104px; white-space: normal; width: calc(100% - 32px); } }
.jm-focus .mk { opacity: 0; }
#b-detail text { transition: opacity .4s; }
.jm-focus #b-detail text { opacity: .3; }
.jm-focus.jm-way #b-detail text { opacity: 1; }
.wf-arm.on .l { stroke-width: var(--find-arm); }
.tl-blk.craft-lit { outline: var(--find-slot-rule) solid var(--paper); }
.pop-in { position: relative; transform: none; max-width: min(var(--find-pop-w), calc(100vw - var(--find-pop-edge) * 2)); width: max-content; border-radius: var(--find-pop-r); padding: var(--find-pop-pad); font-size: var(--find-pop-font); line-height: var(--find-pop-line); transform-origin: center bottom; }
.pop-body { max-height: calc(100vh - var(--find-pop-edge) * 2 - var(--find-tail-h) * 4); overflow: auto; }
.pop-k { font-size: var(--find-kicker); margin-bottom: var(--find-gap) !important; }
.pop-tail { position: absolute; left: 0; top: 0; width: var(--find-tail-w); height: var(--find-tail-h); background: var(--ink); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: center center; }
.find-slot { margin-top: var(--find-slot-pad); padding: var(--find-slot-pad); border: var(--find-slot-rule) dashed var(--mid); font-size: var(--find-slot-font); color: var(--dim); font-weight: var(--find-slot-weight); }
.find-slot .pop-k { display: block; }
.find-star { position: absolute; left: 0; top: 0; width: var(--find-star); height: var(--find-star); margin: calc(var(--find-star) / -2); opacity: 0; pointer-events: none; z-index: var(--find-star-z); }
.find-star svg { display: block; width: 100%; height: 100%; fill: var(--paper); }
.pop.piece .pop-in { width: min(var(--find-piece), calc(100vw - var(--find-tail-w) * 2)); max-width: none; border-top: var(--find-piece-top) solid var(--piece-mark); }
.piece img { display: block; max-width: 100%; height: auto; }
.piece-empty { border: var(--find-slot-rule) solid var(--mid); display: grid; justify-items: center; padding: var(--find-slot-pad); gap: var(--find-gap); margin-bottom: var(--find-slot-pad); color: var(--dim); }
.piece-empty svg { width: var(--find-icon); height: var(--find-icon); }
.piece-empty .l, .piece-empty .t { fill: none; stroke: var(--paper); stroke-width: var(--find-slot-rule); }
.piece-empty .pf { fill: var(--paper); }
.find.hoard, .rubbing { touch-action: none; }
.rune-kept .rn { stroke-opacity: 1; }
.rubbing-sheet .pz { width: var(--find-rune-w); height: var(--find-rune-h); left: calc(var(--find-rune-w) / -2); top: calc(var(--find-rune-h) / -2); perspective: var(--find-rune-perspective); transform-origin: center center; }
.rubbing-sheet .pz-in { transition-duration: var(--find-rune-flip); }
.rubbing-front { padding: 0; }
.rubbing { display: block; width: 100%; height: 100%; cursor: crosshair; }
.rubbing-sheet .poster-back { display: block; text-align: center; }
.poster-slot { position: absolute; bottom: 0; left: 0; width: 100%; padding: var(--find-slot-pad); }
.poster-slot .find-slot { margin: 0; }
.rubbing-sheet .pz-ctl { top: var(--find-ctl-top); left: calc(var(--find-rune-w) / -2); width: var(--find-rune-w); }
.pz-ctl [hidden] { display: none; }
.reel .iris { width: var(--find-iris); height: var(--find-iris); left: calc(var(--find-iris) / -2); top: calc(var(--find-iris) / -2); }
.reel .player { width: var(--find-reel-w); }
.reel-k { position: absolute; top: var(--find-reel-label); left: var(--find-reel-label); z-index: 1; }
.reel-slot { position: absolute; bottom: var(--find-reel-slot); left: var(--find-reel-label); right: var(--find-reel-label); }
.jm-focus .go-back { width: auto; padding: 0 var(--go-gap); display: flex; align-items: center; gap: var(--go-gap); border-radius: var(--go-h); border: var(--find-slot-rule) solid var(--mid); }
.go-back span:empty { display: none; }
@media (max-width: 640px) {
  .jm-steps .lay-band .c-top { padding-right: calc(16px + var(--card-close-hit)); }
  .go.go-end { right: var(--explore-edgePhone); height: auto; flex-wrap: wrap; }
  .go.go-end .go-next { min-width: 0; height: var(--go-h); padding: 0 var(--explore-padEnd) 0 var(--explore-padStart); border-radius: var(--go-h); }
  .go.go-end .go-next .arr { right: var(--explore-arrowPhone); }
}
.rm .rubbing-sheet .pz-in { transition: none; }

/* Hammer sheet: the same Ink panel, quiet rules and Paper strokes as the finds. */
.hm-panel { box-sizing: border-box; position: absolute; left: calc(var(--hm-w) / -2); top: calc(var(--hm-h) / -2); width: var(--hm-w); height: var(--hm-h); padding: var(--hm-pad); border: var(--hm-border) solid var(--line); border-radius: var(--hm-radius); background: var(--ink); color: var(--paper); pointer-events: auto; display: grid; grid-template-rows: var(--hm-header) var(--hm-fieldH) var(--hm-status) var(--hm-buttons); gap: var(--hm-gap); font-size: var(--hm-font); line-height: var(--hm-line); }
.hm-panel p, .hm-panel h2 { margin: 0; }
.hm-header { display: flex; align-items: center; justify-content: space-between; gap: var(--hm-gap); font-size: var(--hm-small); line-height: var(--hm-heartH); }
.hm-wave { max-width: var(--hm-waveShare); }
.hm-vitals { display: flex; flex-direction: column; align-items: end; gap: var(--hm-heartGap); }
.hm-hearts { display: flex; gap: var(--hm-heartGap); }
.hm-hearts svg { width: var(--hm-heartW); height: var(--hm-heartH); stroke: var(--paper); stroke-width: var(--hm-border); }
.hm-field { position: relative; width: var(--hm-fieldW); height: var(--hm-fieldH); }
.hm-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hm-canvas:focus-visible { outline: var(--hm-border) solid var(--paper); outline-offset: calc(var(--hm-border) * -1); }
.hm-card { box-sizing: border-box; position: absolute; inset: var(--hm-inset); padding: var(--hm-cardPad); border: var(--hm-border) solid var(--mid); border-radius: var(--hm-radius); background: var(--ink); display: flex; flex-direction: column; justify-content: center; gap: var(--hm-gap); overflow: auto; }
.hm-card[hidden] { display: none; }
.hm-card h2 { font-size: var(--hm-title); line-height: 1; font-weight: var(--hm-titleWeight); }
.hm-quiet, .hm-status { color: var(--dim); font-size: var(--hm-small); }
.hm-card .find-slot { margin: 0; }
.hm-card .find-slot p { font-size: var(--hm-small); }
.hm-panel button { min-height: var(--hm-buttons); padding: 0 var(--hm-gap); border: var(--hm-border) solid var(--mid); border-radius: var(--hm-gap); color: var(--paper); background: var(--ink); font: inherit; cursor: pointer; }
.hm-panel button:focus-visible { outline: var(--hm-border) solid var(--paper); outline-offset: var(--hm-border); }
.hm-panel button[aria-pressed="true"] { color: var(--ink); background: var(--paper); }
.hm-panel button:disabled { color: var(--dim); cursor: default; }
.hm-buttons { display: flex; gap: var(--hm-gap); }
.hm-buttons button { flex: 1; min-width: 0; }
.hm-buttons .hm-auto { flex: var(--hm-autoFlex); }
.hm-card .hm-rune { display: flex; align-items: center; gap: var(--hm-gap); padding: var(--hm-gap); text-align: left; }
.hm-rune svg { width: var(--hm-runeW); height: var(--hm-rune); flex-shrink: 0; fill: none; stroke: var(--paper); stroke-width: var(--hm-glyphLine); }
.hm-rune span span { display: block; color: var(--note); font-size: var(--hm-small); }
.hm-taken { display: flex; flex-wrap: wrap; gap: var(--hm-gap); }
.hm-taken > span { display: flex; align-items: center; gap: var(--hm-heartGap); }
.hm-taken svg { width: var(--hm-miniW); height: var(--hm-mini); fill: none; stroke: var(--paper); stroke-width: var(--hm-border); }
#f-mist, #f-horn { touch-action: none; }
.mist-wisp { fill: url(#find-mist-soft); }
#hn-rings .hn-ring { fill: none; stroke: var(--paper); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
#hn-rings, #wl-crown, .wl-rip, .wl-pebble, .mist-drift, .mist-glint, .ls-lamp { pointer-events: none; }

/* Round 7 C1 layout, using the existing map and card surfaces. */
.stage-scrim { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; pointer-events: none; opacity: 0; }
.c-h { font-size: var(--card-title); font-weight: var(--card-title-weight); margin-bottom: var(--card-title-gap); }
.c-panel { min-width: 0; }
.c-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--card-foot-gap); margin-top: var(--card-foot-margin); }
.c-foot .c-crafts { flex: 1; max-width: var(--card-crafts); }
.c-foot .c-btn { flex: none; }
.c-btn .arr { color: var(--arrow, currentColor); }
.has-panel .c-panel { background: var(--panel); color: var(--panel-text); border-radius: var(--card-panel-radius); padding: var(--card-panel-pad); --tx: var(--panel-text); --sub: var(--panel-text); --hair: var(--panel-hair); --btn: var(--panel-btn); --btx: var(--panel-btx); }
.has-panel .c-steps li { color: var(--panel-text); border-color: var(--panel-hair); }
.go-top { background: var(--ink); border: 1px solid var(--mid); border-radius: var(--go-h); padding: var(--go-top-pad) var(--go-top-pad-x); }
.jm-explore #ft-world .ft-talk, .jm-explore #ft-world .ft-link, .jm-explore .ft-name > span { pointer-events: none; }
@media (max-width: 640px) { .c-foot { flex-direction: column; align-items: stretch; } .c-foot .c-crafts { width: 100%; } .c-foot .c-btn { width: 100%; } }

</style>

    const f = FIND_BY[o.id], p = findPlace(o.id), rad = o.id === 'wayfinder' ? FIND_PLAY.focus.wide[2] * 2 : o.id === 'hoards' ? Math.max(...FIND_COPY.hoards.map(h => Math.hypot(h.x - f.x, h.y - f.y) + FIND_PLAY.hoard.rad)) : o.id === 'beacon' ? FIND_PLAY.beacon.rad : o.id === 'ravens' ? FIND_PLAY.raven.reach + f.view[2] : o.id === 'serpent' ? FIND_PLAY.serpent.near + f.view[2] : FIND_PLAY[o.id === 'longship' ? 'ship' : o.id]?.rad || f.view?.[2] || FIND_PLAY.kit.rad;
    const near = FIND_PLAY[o.id === 'wayfinder' ? 'way' : o.id === 'ravens' ? 'raven' : o.id === 'runestone' ? 'rune' : o.id === 'longship' ? 'ship' : o.id]?.near || rad;
    findLife(o, ...p, o.id === 'horn' && ['sounding', 'echo'].includes(o.stage) ? FIND_PLAY.horn.soundRad : rad, near);
    const playing = ['flight', 'hear', 'landing', 'reel', 'chase', 'eating', 'waking', 'trace', 'opening', 'sheet', 'closing', 'sliding', 'reply', 'pebble', 'sounding', 'echo', 'pull', 'lifting'].includes(o.stage) || o.drag || o.busy || o.playing || o.hearing;
    if (o.id === 'hoards' || o.onScreen || playing || FD.sheetOwner === o) o.tick?.(time, FD.rm ? 0 : FD.dt);
    else if (o.id === 'beacon') depthBeam(null);
  });
  findKitFrame(); FD.all.tick(time); if (JOURNEY.focus !== FD.focusId) findHint(JOURNEY.focus); FD.focusId = JOURNEY.focus;
}

// ---- main.mjs ----
// Wires the journey map together: builds the stage, listens to scroll and resize, runs the one frame loop.











const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
// Set by join.mjs on the joined page only (the real hero in the stage): frame(st, moved, P) returns false to leave the star
// canvas alone, options for starsFrame, or nothing for the map's own rule; resize(w, h) follows the map's resize.
const JOIN = { leave: null, frame: null, resize: null, heroStart: false };
const ROOT = document.documentElement;
Object.entries(C).forEach(([k, v]) => ROOT.style.setProperty('--' + k, v));
if (RM) ROOT.classList.add('rm');
document.title = COPY.docTitle;

const MAIN = document.getElementById('jm');
const M = bigMap();
MAIN.innerHTML = `<h1 class="sr">${COPY.title}</h1><section class="trip" id="trip" aria-label="${COPY.srMap}"><div class="stage" id="stage">
<canvas id="deep" aria-hidden="true"></canvas>
<svg id="map" class="map" role="group" aria-label="${COPY.srMap}">${mapDefs()}<g id="cam"><g id="b-all"><g id="b-sea">${M.sea}</g><g id="b-fill">${M.fill}</g><g id="b-coast">${M.coast}</g><g id="b-detail">${M.detail}</g></g><path id="trail-done" class="done" d="${pathD(TRAIL)}"/><g id="finds">${M.finds}</g><g id="fxg" transform="translate(${MAP.x[0]} ${MAP.x[1]})"></g></g></svg>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="air" aria-hidden="true"></canvas><svg id="sky" aria-hidden="true"></svg>
<div class="ov">${stoneDefs()}<p class="caption">${COPY.heroCaption}</p><p class="cue">${COPY.cue}</p><div class="cards" id="cards"></div><div class="mini" id="mini" role="navigation" aria-label="${COPY.miniMap}"></div><div class="pop" id="pop" role="status"></div><div class="sheet" id="sheet" role="dialog" aria-modal="false"></div><footer class="ft" id="ft"></footer></div>
</div></section><div class="rm-cards" id="rmcards"></div><div class="tl" id="tl"></div>`;

const $ = id => document.getElementById(id);
const SVG = $('map'), CANVAS = $('stars'), TLEL = $('tl');
// timeline sits in the stage overlay so it can become the footer rule; in reduced motion it is a sticky jump menu
let FTWORLD = null;
if (!RM) { FTWORLD = document.createElement('div'); FTWORLD.id = 'ft-world'; $('stage').querySelector('.ov').appendChild(FTWORLD); FTWORLD.append($('ft'), TLEL); }
else { $('rmcards').appendChild(TLEL); MAIN.appendChild($('ft')); }

let P = 0, dirty = true;
const goStop = i => { if (RM) { cardsList()[i].el.scrollIntoView({ behavior: 'auto', block: 'start' }); return; } JOURNEY.go(STOPS[i].id, { jump: exploreActive() }); };

tripBuild({ svg: SVG, cam: $('cam'), sea: $('b-sea'), fill: $('b-fill'), coastG: $('b-coast'), detail: $('b-detail'), finds: $('finds'), done: $('trail-done'), caption: document.querySelector('.caption'), cue: document.querySelector('.cue'), mini: $('mini') });
$('mini').querySelectorAll('.mm-stop').forEach(b => { b.style.setProperty('--mk', PALETTES[STOPS[+b.dataset.i].palette].mark); b.addEventListener('click', () => goStop(+b.dataset.i)); });
starsBuild(CANVAS);
depthBuild($('deep'), $('air'), $('sky'), RM);
cardsBuild(RM ? $('rmcards') : $('cards'), goStop, RM);
tlBuild(TLEL, { jump: goStop, scrub: p => JOURNEY.set(p) }, RM);
footerBuild($('ft'), RM); footerBuildX($('fxg'), RM);
if (RM) $('rmcards').appendChild(TLEL);
stepsBuild({ stage: $('stage'), rm: RM, resize, joinedTop: () => JOIN.heroStart });
findsBuild(SVG, $('pop'), $('sheet'), $('b-all'), RM);
exploreBuild({ stage: $('stage'), world: FTWORLD, journey: JOURNEY, rm: RM });
document.addEventListener('dragstart', e => e.preventDefault(), true);
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !e.defaultPrevented && !RM && !JOURNEY.moving && cardsClose()) e.preventDefault(); });

function resize() {
  const w = window.innerWidth, h = window.innerHeight, phone = w <= CAMERA.phoneMax;
  const stepMode = !RM;
  const room = stepMode ? (phone ? STEPS.nav.bar : STEPS.nav.h + STEPS.nav.gap + 6) : 0;
  tripResize(w, h, RM ? 0 : (phone ? 44 : 56) + room);
  SVG.setAttribute('width', w); SVG.setAttribute('height', h); SVG.setAttribute('viewBox', `0 0 ${w} ${h}`);
  starsResize(w, h);
  depthResize(w, h);
  if (!RM) cardsResize(stepMode);
  if (FTWORLD) FTWORLD.style.transform = 'none';
  const rule = footerResize();
  tlResize(RM ? null : rule);
  if (!RM) { $('trip').style.height = h + 'px'; exploreResize(); }
  stepsResize(); P = stepsProgress(); dirty = true;
  if (RM) still();
  if (JOIN.resize) JOIN.resize(w, h);
}
const OVERVIEW_P = SEQ.find(s => s.kind === 'overview').a + 1;
function still() { const st = tripState(OVERVIEW_P); tripApply(st); starsStill(st); depthFrame(st, 0, 0, [.5, .5], { look: [0, 0], changed: false, fine: false }, true); FIXED = st; }
let FIXED = null;

window.addEventListener('scroll', () => { if (RM) dirty = true; }, { passive: true });
window.addEventListener('jm-explore', () => { dirty = true; });
window.addEventListener('resize', resize);
window.addEventListener('jm-depth', () => { dirty = true; depthInvalidate(); if (RM && FIXED) still(); });
const PTR = [.5, .5];
window.addEventListener('pointermove', e => { PTR[0] = e.clientX / VIEW.w; PTR[1] = e.clientY / VIEW.h; findsPointer(e.clientX, e.clientY); }, { passive: true });

let raf = 0, lastP = -1, lastVisited = '', mainTs = null, mainSkyDraw = -Infinity, mainTuning = '', mainFocus = '';
function frame(ts) {
  const time = ts / 1000;
  const dt = mainTs === null ? 0 : Math.max(0, Math.min(STEPS.frameMax, (ts - mainTs) / 1000)); mainTs = ts;
  P = stepsFrame(ts);
  if (JOIN.leave) JOIN.leave(P);
  if (RM) { findsFrame(time, FIXED); const jr = JOIN.frame && JOIN.frame(FIXED, true, P); if (jr) starsFrame(0, FIXED, [.5, .5], { ...jr, still: true }); raf = requestAnimationFrame(frame); return; }
  const st = tripState(P); const f = stepsFocusNow(); if (f) tripFocus(st, f.view, f.k);
  const explored = exploreApply(st, dt), folded = cardsOverride(st, dt, JOURNEY.moving);
  st.visiting = JOURNEY.visiting;
  const focusKey = JSON.stringify(f), tuning = JSON.stringify([DEPTH, NOVA]), moved = dirty || explored || folded || P !== lastP || tuning !== mainTuning || focusKey !== mainFocus;
  mainFocus = focusKey;
  const aim = depthLook(dt, PTR);
  if (moved) { tripApply(st); tlFrame(st); footerFrame(st); if (!JOIN.frame) CANVAS.style.opacity = st.dim; lastP = P; mainTuning = tuning; dirty = false; const v = st.visited.join(); if (v !== lastVisited) { lastVisited = v; tripMiniVisited(st); } }
  const jo = JOIN.frame ? JOIN.frame(st, moved, P) : undefined;
  depthFrame(st, time, dt, PTR, aim, moved);
  footerMotion(time, dt, st, aim.look, moved);
  const starsChanged = starsTick(dt, st);
  const skyIdle = starsSkyVisible(st) && time - mainSkyDraw >= 1 / DEPTH.idleFps;
  if (jo !== false && (moved || starsChanged || st.handoffT < 1 || jo || aim.changed || skyIdle || st.blastT > 0)) {
    starsFrame(time, st, PTR, { ...(jo || {}), look: aim.look }); mainSkyDraw = time;
  }
  cardsFrame(st, aim.look, PTR);
  findsFrame(time, st);
  raf = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { stepsPause(); mainTs = null; if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!raf) raf = requestAnimationFrame(frame); });
const start = () => { resize(); raf = requestAnimationFrame(frame); };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
